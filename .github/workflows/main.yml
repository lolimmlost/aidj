name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint code
        run: npm run lint
        
      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npx vitest run

  # TODO(e2e): The Playwright job was removed 2026-07-28 because it never
  # actually ran tests — `npm run dev` (Playwright's webServer) crashloops on
  # startup env validation since the job provides no env vars. Restoring it
  # requires: dummy values for the nine required vars in src/env/server.ts,
  # a PostgreSQL service container for DATABASE_URL (+ migrations), and
  # making the e2e suite tolerant of unreachable Navidrome/Ollama/Lidarr.
  # Until then, run e2e locally with `npm run test:e2e`.

  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: npm audit --audit-level high
        continue-on-error: true
        
      - name: Fail on high/critical vulnerabilities
        run: |
          # npm audit exits non-zero when vulns are present, so `|| true`
          # lets us capture the JSON and parse the counts ourselves.
          audit_json=$(npm audit --json || true)
          high=$(echo "$audit_json" | jq '.metadata.vulnerabilities.high // 0')
          crit=$(echo "$audit_json" | jq '.metadata.vulnerabilities.critical // 0')
          echo "npm audit: high=$high critical=$crit"
          if [ "$high" -gt 0 ] || [ "$crit" -gt 0 ]; then
            echo "High or critical vulnerabilities found!"
            exit 1
          fi
        if: always()

  secret-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      - name: Fail if secrets detected
        run: |
          if [ -f gitleaks.txt ] && [ $(wc -l < gitleaks.txt) -gt 0 ]; then
            echo "Secrets detected in code!"
            cat gitleaks.txt
            exit 1
          fi
        if: always()